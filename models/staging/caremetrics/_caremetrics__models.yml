models:
  - name: stg_caremetrics__locations
    description: >
      One row per Larkspur Health clinic.
      Cleaned one-to-one from the caremetrics.locations source: renamed columns, Airbyte metadata dropped.
    columns:
      - name: location_id
        description: "Primary key. The source id (a UUIDv7), renamed."
        data_tests:
          - unique
          - not_null
      - name: location_name
        description: "Display name of the clinic, unique across clinics (enforced in the source)."
        data_tests:
          - unique
          - not_null
      - name: city
        description: "City where the clinic is located."
        data_tests:
          - not_null
      - name: state
        description: "Two-letter US state code of the clinic."
        data_tests:
          - not_null
      - name: created_at
        description: >
          When the clinic went live in the operational system (UTC), effectively its opening date.
          Colorado Springs North opened in April 2025, inside the appointment history, so its volume ramps up from there.
        data_tests:
          - not_null
      - name: updated_at
        description: >
          When the clinic's record last changed in the source (UTC), set by a trigger on every update.
          Equal to created_at for clinics that have never been edited.
        data_tests:
          - not_null
  - name: stg_caremetrics__payers
    description: >
      One row per insurance payer (plan) the practice bills.
      Cleaned one-to-one from the caremetrics.payers source: renamed columns, Airbyte metadata dropped.
      Uninsured (self-pay) patients have no payer row, and their encounters produce no claims.
    columns:
      - name: payer_id
        description: "Primary key. The source id (a UUIDv7), renamed."
        data_tests:
          - unique
          - not_null
      - name: payer_name
        description: "Name of the payer. Invented, not a real insurer. Unique across payers (enforced in the source)."
        data_tests:
          - unique
          - not_null
      - name: payer_type
        description: >
          Category of the payer: commercial, medicare, medicaid or other_government.
          The usual grouping for comparing denial rates, paid-to-billed ratios and days to payment.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [commercial, medicare, medicaid, other_government]
      - name: created_at
        description: "When the payer contract was set up in the operational system (UTC)."
        data_tests:
          - not_null
      - name: updated_at
        description: >
          When the payer's record last changed in the source (UTC), set by a trigger on every update.
          Equal to created_at for payers that have never been edited.
        data_tests:
          - not_null
  - name: stg_caremetrics__providers
    description: >
      One row per clinician, active or departed.
      Cleaned one-to-one from the caremetrics.providers source: renamed columns, Airbyte metadata dropped.
      Departed providers stay in the table with is_active = false.
    columns:
      - name: provider_id
        description: "Primary key. The source id (a UUIDv7), renamed."
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: "Provider's first name (synthetic)."
        data_tests:
          - not_null
      - name: last_name
        description: "Provider's last name (synthetic)."
        data_tests:
          - not_null
      - name: location_id
        description: >
          The clinic the provider works at.
          Primary care providers work at every clinic, specialists only at the three established "hub" clinics.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_caremetrics__locations")
                field: location_id
      - name: is_active
        description: >
          False once the provider has left the practice; renamed from the source's active.
          Departures are updates, never deletes, so departed providers keep their history.
        data_tests:
          - not_null
      - name: specialty
        description: >
          Clinical specialty, one of ten. It shapes which patients the provider sees and the visit mix.
          The source does not constrain the values, so a new specialty only warns.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "Cardiology",
                    "Dermatology",
                    "Endocrinology",
                    "Family Medicine",
                    "Gastroenterology",
                    "Internal Medicine",
                    "Obstetrics and Gynecology",
                    "Orthopedics",
                    "Pediatrics",
                    "Psychiatry",
                  ]
              config:
                severity: warn
      - name: created_at
        description: "The provider's hire date (UTC). Never before their clinic went live."
        data_tests:
          - not_null
      - name: updated_at
        description: >
          When the provider's record last changed in the source (UTC), set by a trigger on every update.
          For departed providers this is currently the departure date, because the source does not edit them otherwise.
          That is an observation about the data, not a source rule; use snapshots for departure history.
        data_tests:
          - not_null
  - name: stg_caremetrics__patients
    description: >
      One row per registered patient, in its latest version.
      Synthetic data, no real PHI.
      Cleaned one-to-one from the caremetrics.patients source, an incremental Airbyte stream deduplicated on id.
      Insurance is not stored on the patient: a payer appears only on claims, and uninsured patients have none.
    columns:
      - name: patient_id
        description: "Primary key. The source id (a UUIDv7), renamed."
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: "Patient's first name (synthetic)."
        data_tests:
          - not_null
      - name: last_name
        description: "Patient's last name (synthetic)."
        data_tests:
          - not_null
      - name: date_of_birth
        description: >
          Date of birth, a plain date with no time zone.
          Compute age relative to the event being analyzed (for example the appointment date), not today.
        data_tests:
          - not_null
      - name: gender
        description: "Recorded gender: female, male, other or unknown (enforced in the source)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [female, male, other, unknown]
      - name: state
        description: "Two-letter US state code of the patient's residence, not of the clinic they visit."
        data_tests:
          - not_null
      - name: created_at
        description: "When the patient registered with the practice (UTC). Never before the date of birth."
        data_tests:
          - not_null
      - name: updated_at
        description: >
          When the patient's record last changed in the source (UTC), set by a trigger on every update.
          About 15% of patients were edited after registration (address, name or demographic corrections).
        data_tests:
          - not_null
  - name: stg_caremetrics__appointments
    description: >
      One row per appointment (booked visit), in its latest status.
      Cleaned one-to-one from the caremetrics.appointments source, an incremental Airbyte stream deduplicated on id.
      Covers about two years of history plus about 60 days of future bookings.
    columns:
      - name: appointment_id
        description: "Primary key. The source id (a UUIDv7), renamed."
        data_tests:
          - unique
          - not_null
      - name: patient_id
        description: "The patient who booked the appointment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_caremetrics__patients")
                field: patient_id
      - name: provider_id
        description: "The provider the appointment is with."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_caremetrics__providers")
                field: provider_id
      - name: location_id
        description: "The clinic where the appointment takes place."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_caremetrics__locations")
                field: location_id
      - name: scheduled_at
        description: "When the visit is (or was) scheduled to start (UTC). In the future for upcoming bookings."
        data_tests:
          - not_null
      - name: appointment_status
        description: >
          Current status, renamed from the source's status: scheduled, completed, cancelled or no_show (enforced in the source).
          Only the latest status is kept; there is no timestamp for when it changed.
          Every completed appointment has exactly one encounter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [scheduled, completed, cancelled, no_show]
      - name: appointment_type
        description: "Kind of visit (enforced in the source). A patient's first visit with a specialty is new_patient."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [new_patient, follow_up, annual_wellness, consultation, procedure, urgent, telehealth]
      - name: created_at
        description: "When the appointment was booked (UTC). scheduled_at minus created_at is the booking lead time."
        data_tests:
          - not_null
      - name: updated_at
        description: >
          When the appointment's record last changed in the source (UTC), set by a trigger on every update,
          typically when its status changed.
        data_tests:
          - not_null

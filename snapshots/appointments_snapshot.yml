snapshots:
  - name: appointments_snapshot
    relation: ref('stg_caremetrics__appointments')
    description: >
      One row per version of each appointment, from the first snapshot run onward; history from before then is not available.
      A version is valid from the appointment's updated_at until the next version's (dbt_valid_to is null for the current version).
      For changes made by the source simulator, updated_at is when the change was written, not the simulated event time,
      so version periods do not show when a status really changed and do not measure booking-to-outcome durations.
    config:
      unique_key: appointment_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: ignore

snapshots:
  - name: patients_snapshot
    relation: ref('stg_caremetrics__patients')
    description: >
      One row per version of each patient, from the first snapshot run onward; history from before then is not available.
      A version is valid from the patient's updated_at until the next version's (dbt_valid_to is null for the current version).
      Each new version is a record edit, such as an address, name or demographic correction.
      For edits made by the source simulator, updated_at is when the edit was written, not the simulated event time.
    config:
      unique_key: patient_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: ignore
    columns:
      - name: patient_id
        description: "The patient's primary key. Not unique here: one row per version."
        data_tests:
          - not_null
          - unique:
              config:
                where: "dbt_valid_to is null"
      - name: dbt_scd_id
        description: "Unique ID of this version, generated by dbt."
        data_tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: "When this version became true: the patient's updated_at (UTC)."
      - name: dbt_valid_to
        description: "When this version was replaced by the next one (UTC); null for the current version."

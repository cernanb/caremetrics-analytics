snapshots:
  - name: providers_snapshot
    relation: ref('stg_caremetrics__providers')
    description: >
      One row per version of each provider, from the first snapshot run onward; history from before then is not available.
      A version is valid from the provider's updated_at until the next version's (dbt_valid_to is null for the current version).
      The source simulator does not change providers, so each provider keeps one version until the source records
      departures or clinic transfers; this history is where such changes, including transfers, will be captured.
    config:
      unique_key: provider_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: ignore
    columns:
      - name: provider_id
        description: "The provider's primary key. Not unique here: one row per version."
        data_tests:
          - not_null
          - unique:
              config:
                where: "dbt_valid_to is null"
      - name: dbt_scd_id
        description: "Unique ID of this version, generated by dbt."
        data_tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: "When this version became true: the provider's updated_at (UTC)."
      - name: dbt_valid_to
        description: "When this version was replaced by the next one (UTC); null for the current version."

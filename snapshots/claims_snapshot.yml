snapshots:
  - name: claims_snapshot
    relation: ref('stg_caremetrics__claims')
    description: >
      One row per version of each claim, from the first snapshot run onward; history from before then is not available.
      A version is valid from the claim's updated_at until the next version's (dbt_valid_to is null for the current version).
      For changes made by the source simulator, updated_at is when the change was written, not the simulated event time,
      so version periods do not measure real payer turnaround.
    config:
      unique_key: claim_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: ignore
    columns:
      - name: claim_id
        description: "The claim's primary key. Not unique here: one row per version."
        data_tests:
          - not_null
          - unique:
              config:
                where: "dbt_valid_to is null"
      - name: dbt_scd_id
        description: "Unique ID of this version, generated by dbt."
        data_tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: "When this version became true: the claim's updated_at (UTC)."
      - name: dbt_valid_to
        description: "When this version was replaced by the next one (UTC); null for the current version."
